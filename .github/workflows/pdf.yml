name: Build PDF draft

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pdf-draft
  cancel-in-progress: false

jobs:
  pdf:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache fonts
        id: font-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/fonts/Lato_*.ttf
            ~/.local/share/fonts/IBMPlexMono_*.ttf
          key: ${{ runner.os }}-fonts-${{ hashFiles('scripts/install-fonts.sh') }}
      - name: Install fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: ./scripts/install-fonts.sh
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
          cache-dependency-path: main.typ
      - name: Build PDF
        run: |
          mkdir _pages
          ./scripts/build.sh _pages/appunti-radioamatore.pdf
          cp README.md _pages/README.md
      - uses: actions/configure-pages@v5
      - name: Build landing page
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
